name: Reminder Android
on:
  push:
    branches: [master, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build installable debug APK
        run: ./gradlew testCoreDebugUnitTest assembleCoreDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reminder-debug-and-tests
          path: |
            app/build/outputs/apk/core/debug/*.apk
            app/build/reports/tests/testCoreDebugUnitTest/
