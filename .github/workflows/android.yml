name: Reminder Android
on:
  push:
    branches: [master, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build installable debug APK
        run: ./gradlew testCoreDebugUnitTest assembleCoreDebug --no-daemon
      - name: Verify APK identity and signature
        run: |
          for apk in app/build/outputs/apk/core/debug/*.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | head -5
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk"
            sha256sum "$apk"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reminder-debug-and-tests
          path: |
            app/build/outputs/apk/core/debug/*.apk
            app/build/reports/tests/testCoreDebugUnitTest
            app/build/test-results/testCoreDebugUnitTest/*.xml/
